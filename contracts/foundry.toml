[profile.default]
src = "src"
out = "out"
libs = ["lib"]
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
base = "${BASE_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
# Public Base Sepolia endpoint as fallback, so a missing env var still works.
base_sepolia = "https://sepolia.base.org"

[etherscan]
base = { key = "${BASESCAN_API_KEY}" }
polygon = { key = "${POLYGONSCAN_API_KEY}" }
base_sepolia = { key = "${BASESCAN_API_KEY}" }

# ── Base Sepolia deployment profile ────────────────────────────────────────
# Addresses verified ON-CHAIN against AaveV3BaseSepolia (bgd-labs address book),
# then cross-checked by reading the contracts back:
#
#   chainId 84532
#   PROVIDER 0xE4C23309117Aa30342BFaae6c95c6478e0A4Ad00  (6697 bytes of code)
#   POOL      0x8bAB6d1b75f19e9eD9fCe8b9BD338844fF79aE27  (1853 bytes of code)
#   premium   5 bps  (FLASHLOAN_PREMIUM_TOTAL - same as mainnet)
#   WETH      0x4200000000000000000000000000000000000006  (~1540 WETH available)
#
# These are SEPOLIA addresses and are NOT the mainnet ones. Reusing mainnet
# values here is a real failure mode: the constructor calls getPool() on
# whatever provider it is handed, so a mainnet provider yields a contract that
# can never take a flash loan on chain 84532.
[profile.sepolia]
src = "src"
out = "out"
libs = ["lib"]
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
eth_rpc_url = "https://sepolia.base.org"
# Guard rail: refuse to broadcast above this gas price rather than risk paying
# an absurd amount on a mistyped command.
gas_price = 50_000_000_000
