# Railway Deployment Configuration for Trade Arena Core
name = "trade-arena-core"
# Generated by auto-deployment

[build]
builder = "heroku/buildpacks:node"
build_command = "npm ci --production"

[deploy]
release_command = "npm start"
run_command = "node server.js"

[services]
  [services.0]
  internal_port = 3001
  protocol = "http"

# Environment variables configuration
[environments.production]
NODE_ENV = "production"
PORT = "3001"
HOST = "0.0.0.0"

# Static file serving
[static]
directory = "."
index_document = "index.html"

# Resource configuration
[resources]
memory = 1024
# CPU allocation
cpu = 512

# Buildpacks configuration
buildpacks = [
  "heroku/buildpacks:node",
  "heroku/buildpacks:npm"
]

# Health check configuration
[healthcheck]
enabled = true
endpoint = "/health"
interval = "30s"

# Logging configuration
[logging]
level = "info"
format = "json"

# Deployment strategy
[deploy.strategy]
type = "rolling"
maximum_unavailable = 1
maximum_unhealthy = 2

# Resource limits
[[limits]]
cpu = 512
memory_mb = 1024
disk_mb = 2048